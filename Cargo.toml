[package]
name = "living-wallpaper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Animated desktop wallpaper with extensible swarm models"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "0.19.4"
winit = "0.29.15"
raw-window-handle = "0.6"

[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Security"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
